# M2 sync screen (T-2.5, PLAN.md §2 M2, §4.4 "M2: C1 on TT vs GPU (screen)"): C1 (--mode sync) on the TT
# server_g1 :5557 vs C1 on the RT-owned GPU VLA :5565, the DP1 checkpoint in both, GPU WBC :5556 in both,
# common random numbers. n = 50 paired (DP10), screen seeds 1000-1049; one loop process.
# Both arms run fresh in S1b, and the GPU arm needs a GPU VLA started with --noise cpu: --crn gives both arms the same
# noise_seed per request, and only then does gpu_vla_server draw server_g1's CPU noise for it (with the default
# --noise cuda, as in T-1.9, the arms would not be noise-paired). jobs/t2_sync.sh refuses any other GPU VLA.
# Gate (triage): lower 80% bound of (TT - GPU) >= -25 pts; 0 server errors or hangs (rttt/m2_checks.py errors).
# Run inside session S1b (jobs/t2_sync.sh, which also runs the stock-rollout anchor, on a session copy of this
# matrix with the session's endpoints in place of the D15 URLs below, rttt/m2_checks.py matrix):
#   simpy $RT/scripts/eval_paired.py --matrix $RT/configs/eval_m2_sync.yaml --out $CHIP_SESSION_DIR/m2_sync
# Each arm's --vla follows common_args on the loop command line (eval_paired.py plan_jobs), so it is the one used.
name: m2_sync
seeds: "1000-1049"
procs: 1
block: 10                      # arms interleaved by seed blocks of 10 (thermal / clock drift)
max_ticks: 1440
gross_drop: -0.25
common_args: "--mode sync --wbc tcp://127.0.0.1:5556 --crn --max-ticks 1440"
arms:
  - {name: C1tt,  args: "--vla tcp://127.0.0.1:5557"}
  - {name: C1gpu, args: "--vla tcp://127.0.0.1:5565"}
compare:
  - [C1tt, C1gpu]
