# M1 primary comparison (T-1.9, PLAN.md §4.4): RT C4 (v1, s 16, B 0) vs RT C1 (--mode sync), DP1 checkpoint on
# the RT-owned GPU VLA :5565, GPU WBC :5556, common random numbers. n = 50 paired (DP10, seeds 2000-2049);
# gated on gross drops only: lower 80% bound of (C4 - C1) >= -25 pts. One loop process (RT timing).
#   simpy $RT/scripts/eval_paired.py --matrix $RT/configs/eval_m1_primary.yaml --out $RT/runs/m1_primary
name: m1_primary
seeds: "2000-2049"
procs: 1
block: 10                      # arms interleaved by seed blocks of 10 (thermal / clock drift)
max_ticks: 1440
gross_drop: -0.25
common_args: "--vla tcp://127.0.0.1:5565 --wbc tcp://127.0.0.1:5556 --crn --max-ticks 1440"
arms:
  - {name: C1, args: "--mode sync"}
  - {name: C4, args: "--mode rt --arm v1 --s 16 --B 0"}
compare:
  - [C4, C1]
