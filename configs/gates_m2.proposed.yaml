# SUPERSEDED (2026-10-25): merged into $RT/gates.yaml's m2_rt, which also gates starvation (starved_frac_max,
# starved_run_max) and TT error replies (vla_errors_max). jobs/t2_soak.sh now derives its session copy from gates.yaml
# (rttt/m2_checks.py gates) and nothing reads or copies this file; it is kept only as the record of the proposal.
#
# Proposed M2 gate set (PLAN.md §4.2 `m2_rt`, T-2.6), for gates.yaml once M1 is done (gates.yaml is M1-owned).
# Until then: simpy $RT/scripts/analyze_run.py RUN --gates m2_rt --gates-file $RT/configs/gates_m2.proposed.yaml
# Every key below is one scripts/analyze_run.py GATE_KEYS knows (an unknown key exits 2).
#
# m2_rt = the T-1.4 timing rows of m1_rt, with d p99 <= 3 and VLA p50 <= 1.1 x the T-2.3 p50; starvation <= 0.1%
# with no starved run > 10 ticks; 0 TT error replies; 0 hangs (timeouts). Three have no analyze_run key yet
# (requested change; jobs/t2_soak.sh checks them from verdict.json's metrics through rttt/m2_checks.py soak):
#   starved_frac_max: 0.001     -> metric starved_frac      (computed already)
#   starved_run_max: 10         -> metric starved_run_max   (computed already)
#   vla_errors_max: 0           -> metric vla_errors = requests with outcome ERROR (new; outcome_counts has it)
# Left out on purpose: m1_rt's starved_ticks_max: 0 (M2 allows 0.1%) and d_p50_in: [3, 4] (TT d p50 is unmeasured;
# T-2.3 projects 2-3). vla_p50_ms is the server's service time (analyze_run.py); the default here is 1.1 x the
# projected 45 ms server total of T-2.3, and t2_soak.sh re-derives it from the measured T-2.3 bench
# (rttt/m2_checks.py gates). The viewer rows need a run with --viewer (§4.3: timing gates count with the HUD,
# recording and viewer on); t2_soak.sh drops them, with a note, when it runs without a display.
m2_rt:
  period_p99_ms: 21.0
  period_max_ms: 30.0
  overrun_frac_max: 0.005      # compute > 20 ms
  slips_max: 0
  viewer_k0_ms_max: 3.0
  viewer_p99_ms_max: 3.0
  wbc_rtt_p50_ms: 1.0
  wbc_rtt_p99_ms: 2.0
  wbc_rtt_over20_frac_max: 0.001
  wbc_fallback_frac_max: 0.001
  shadow_da_p99_max: 1.0e-4
  d_p99_max: 3
  inflight_max: 1
  safety_faults_max: 0
  vla_timeouts_max: 0          # T-2.6/T-2.8: no device hangs
  vla_p50_ms_max: 49.5         # 1.1 x 45 ms (T-2.3 projected server total); re-derived per session
