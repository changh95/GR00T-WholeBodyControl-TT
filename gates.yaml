# Acceptance thresholds applied by scripts/analyze_run.py (PLAN.md §4.2). Times in ms unless noted.
# Measured outside reset windows; tick 0 of each episode is included. An operator pause (HUD p) is not a period.
# Every key must be one analyze_run.py GATE_KEYS knows (an unknown key exits 2); a gated metric without data fails.
m1_rt:
  period_p99_ms: 21.0
  period_max_ms: 30.0
  overrun_frac_max: 0.005      # compute > 20 ms
  slips_max: 0
  viewer_k0_ms_max: 3.0
  viewer_p99_ms_max: 3.0
  wbc_rtt_p50_ms: 1.0
  wbc_rtt_p99_ms: 2.0
  wbc_rtt_over20_frac_max: 0.001
  wbc_fallback_frac_max: 0.001
  shadow_da_p99_max: 1.0e-4
  d_p50_in: [3, 4]
  d_p99_max: 5
  inflight_max: 1
  starved_ticks_max: 0
  safety_faults_max: 0
  vla_p50_ms_max: 71.5         # 1.1 x 65 ms (the M1 GPU baseline, idle paced)
m1_negctl:                     # expected to FAIL m1_rt: WBC behind the VLA on one REP socket
  wbc_rtt_over20_or_timeout_frac_min: 0.03
m1_sim_smoke:                  # mock VLA + ORT WBC, no viewer (CI-style smoke)
  period_p99_ms: 21.0
  period_max_ms: 30.0
  slips_max: 0
  inflight_max: 1
  starved_ticks_max: 0
  safety_faults_max: 0

# m2_rt (T-2.6, T-2.8): the T-1.4 timing rows of m1_rt with d p99 <= 3, starvation <= 0.1% with no starved run over
# 10 ticks, 0 TT error replies, 0 hangs (VLA timeouts), VLA p50 <= 1.1 x the T-2.3 server p50. Not here on purpose:
# m1_rt's starved_ticks_max 0 (M2 allows 0.1%) and d_p50_in (TT d p50 is unmeasured). vla_p50_ms is the server's
# service time; 49.5 = 1.1 x the projected 45 ms server total (the T-2.6 soak job re-derived it per session from the
# measured T-2.3 bench).
m2_rt:
  period_p99_ms: 21.0
  period_max_ms: 30.0
  overrun_frac_max: 0.005
  slips_max: 0
  viewer_k0_ms_max: 3.0
  viewer_p99_ms_max: 3.0
  wbc_rtt_p50_ms: 1.0
  wbc_rtt_p99_ms: 2.0
  wbc_rtt_over20_frac_max: 0.001
  wbc_fallback_frac_max: 0.001
  shadow_da_p99_max: 1.0e-4
  d_p99_max: 3
  inflight_max: 1
  starved_frac_max: 0.001
  starved_run_max: 10
  safety_faults_max: 0
  vla_errors_max: 0            # TT error replies
  vla_timeouts_max: 0          # no device hangs
  vla_p50_ms_max: 49.5

# m3_sim (T-3.3: x280d --backend sim, no device; "All T-1.4 gates; WBC RTT p99 <= 2 ms"). Merged from
# configs/gates_m3.proposed.yaml with three changes against the proposal: fallbacks <= 0.1% instead of 0, d p99 <= 5
# (T-1.4) instead of none (§4.2's m3_sim d p99 <= 3 assumes the TT VLA; T-3.3 ran the GPU VLA or the 60 +- 5 ms
# mock, d = 4), and starvation as m2 instead of 0 ticks. shadow 1e-2 is the fp16 bound (T-3.1, T-3.6): fp16 by design
# differs from ORT by about 7e-3. Viewer rows left out: T-3.3 may run headless, and they fail "no data" without
# --viewer.
m3_sim:
  period_p99_ms: 21.0
  period_max_ms: 30.0
  overrun_frac_max: 0.005
  slips_max: 0
  wbc_rtt_p99_ms: 2.0
  wbc_rtt_over20_frac_max: 0.001
  wbc_fallback_frac_max: 0.001 # PLAN T-3.3 "All T-1.4 gates" -> T-1.4 "WBC fallbacks <= 0.1% of ticks"; §4.2 gives
                               # m3_sim no "fallbacks 0" (m3_rt and m3_rt_slow have it)
  wbc_x280_frac_min: 0.999     # the run really went through x280d (a fallback-only run cannot pass)
  shadow_da_p99_max: 1.0e-2
  d_p99_max: 5
  inflight_max: 1
  starved_frac_max: 0.001      # PLAN §4.2 m3_sim starvation "as m2": <= 0.1% of ticks,
  starved_run_max: 10          # and no starved run over 10 ticks (the m2_rt rows)
  safety_faults_max: 0

# m3_rt (T-3.7) = §4.2's m3_rt row on the m2_rt rows: WBC RTT p99 <= 2 ms, d p99 <= 3, starvation as m2, 0 fallbacks,
# heartbeat continuity 100% (x280d's tick ring, see analyze_run.py; jobs must dump it into the run or the session
# dir). Every tick is computed by the X280. shadow_da_p99_max is the fp16 bound (DP4 default); with DP4 fp32 use
# 5.0e-5. vla_p50_ms_max is the M2 projection; T-3.7 asks TT p50 within +-5% of T-2.3, which jobs/m3_eval.sh
# re-derives from the session's T-2.3 bench (M3_T23_BENCH).
m3_rt:
  period_p99_ms: 21.0
  period_max_ms: 30.0
  overrun_frac_max: 0.005
  slips_max: 0
  viewer_k0_ms_max: 3.0
  viewer_p99_ms_max: 3.0
  wbc_rtt_p99_ms: 2.0
  wbc_rtt_over20_frac_max: 0.001
  wbc_fallback_frac_max: 0.0
  wbc_x280_frac_min: 1.0
  shadow_da_p99_max: 1.0e-2
  d_p99_max: 3
  inflight_max: 1
  starved_frac_max: 0.001
  starved_run_max: 10
  safety_faults_max: 0
  vla_errors_max: 0
  vla_timeouts_max: 0
  vla_p50_ms_max: 49.5
  x280_heartbeat_continuity_min: 1.0

# m3_rt_slow (DP11, accepted): as m3_rt with WBC RTT p99 <= 9 ms (run with --wbc-timeout-ms 12 and x280d serve --slow,
# §1.4.4 step 4). §4.2's alternative "visible wait p99 <= 2 ms with early dispatch" is the key
# wbc_visible_wait_p99_ms: 2.0 in place of wbc_rtt_p99_ms; it has data only once the WP-3.8b client sets wbc_early.
m3_rt_slow:
  period_p99_ms: 21.0
  period_max_ms: 30.0
  overrun_frac_max: 0.005
  slips_max: 0
  viewer_k0_ms_max: 3.0
  viewer_p99_ms_max: 3.0
  wbc_rtt_p99_ms: 9.0
  wbc_rtt_over20_frac_max: 0.001
  wbc_fallback_frac_max: 0.0
  wbc_x280_frac_min: 1.0
  shadow_da_p99_max: 1.0e-2
  d_p99_max: 3
  inflight_max: 1
  starved_frac_max: 0.001
  starved_run_max: 10
  safety_faults_max: 0
  vla_errors_max: 0
  vla_timeouts_max: 0
  vla_p50_ms_max: 49.5
  x280_heartbeat_continuity_min: 1.0
